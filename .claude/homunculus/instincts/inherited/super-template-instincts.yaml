# Super Template Workflow Add Or Update Tests For Core Modules

## Action

Follow the add-or-update-tests-for-core-modules workflow:
1. Identify core modules/packages lacking tests or with uncovered logic.
2. Create new test files (e.g., .spec.ts) or update existing ones.
3. Update test runner configuration (e.g., vitest config, package.json test scripts) to include new test paths.
4. Verify that tests are picked up and run in CI or local scripts.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: packages/*/src/**/*.spec.ts, apps/api/vitest.config.ts, apps/api/package.json

