# Super Template Workflow Remove Generated Or Artifact Files

## Action

Follow the remove-generated-or-artifact-files workflow:
1. Identify and delete generated or artifact files from the repository (e.g., logs, CSV exports, scratch files, extension artifacts).
2. Update .gitignore to include the relevant directories or file patterns.
3. Optionally, update documentation if references to these files exist.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: .gitignore, packages/extension/artifacts/*, apps/api/storage/exports/*

