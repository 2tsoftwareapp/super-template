# Super Template Workflow Fix Lint Or Type Errors Monorepo Wide

## Action

Follow the fix-lint-or-type-errors-monorepo-wide workflow:
1. Identify lint/type errors via CI or local scripts.
2. Update source files to fix lint/type issues (e.g., type/interface changes, import ordering, export maps).
3. Update or add eslint/vitest config as needed to ignore or include files.
4. Run lint/verify scripts to confirm all errors are resolved.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: eslint.config.mjs, packages/*/src/**/*.ts, apps/*/src/**/*.ts

