name: mobile_app
description: Production-oriented Flutter starter for Super Template.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.1
  app_links: ^7.1.1
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  built_collection: ^5.1.1
  built_value: ^8.12.0
  super_template_api:
    path: lib/generated/api
  firebase_core: ^3.15.1
  firebase_messaging: ^15.2.9
  file_picker: ^10.2.0
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  mobile_core:
    path: ../../packages/mobile_core
  feature_identity:
    path: ../../packages/feature_identity_mobile
  feature_platform:
    path: ../../packages/feature_platform_mobile

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
