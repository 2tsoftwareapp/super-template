packages:
  - "apps/api"
  - "apps/web"
  - "apps/web/e2e"
  - "packages/*"
allowBuilds:
  '@scarf/scarf': true
  argon2: true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@nestjs/common@11.1.27'
  - '@nestjs/core@11.1.27'
  - '@nestjs/platform-express@11.1.27'
  - '@nestjs/testing@11.1.27'
  - '@playwright/test@1.61.0'
  - '@vitest/expect@4.1.9'
  - '@vitest/mocker@4.1.9'
  - '@vitest/pretty-format@4.1.9'
  - '@vitest/runner@4.1.9'
  - '@vitest/snapshot@4.1.9'
  - '@vitest/spy@4.1.9'
  - '@vitest/utils@4.1.9'
  - nodemailer@9.0.0
  - playwright-core@1.61.0
  - playwright@1.61.0
  - vitest@4.1.9
