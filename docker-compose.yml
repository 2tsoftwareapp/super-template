services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lean
      POSTGRES_PASSWORD: lean
      POSTGRES_DB: lean
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lean -d lean"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
