name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Generate/contract verification and source-quality gates run as independent
# parallel jobs so a failure in one (e.g. generate:check) can never silently
# skip the other (lint/typecheck/test/build).

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      api_e2e: ${{ steps.filter.outputs.api_e2e }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'apps/api/**'
              - 'packages/*/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.json'
              - '.github/workflows/**'
            frontend:
              - 'apps/admin/**'
              - 'apps/web/**'
            api_e2e:
              - 'apps/api/**'
              - 'packages/api-*/**'
              - 'packages/database-runtime/**'
              - 'packages/feature-*/**'
              - 'packages/config/**'
              - 'packages/observability/**'
              - 'infra/**'
              - 'scripts/**'
              - 'pnpm-lock.yaml'
            mobile:
              - 'apps/mobile/**'
              - 'packages/mobile_core/**'
              - 'tools/mobile-verification/**'

  generated:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.mobile == 'true'
    name: Verify generated docs and contracts
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.2
        env:
          POSTGRES_DB: fullstack_starter
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 65432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fullstack_starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "65432"
      POSTGRES_EXPOSED_PORT: "65432"
      POSTGRES_DB: fullstack_starter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_MIGRATE_URL: postgresql://postgres:postgres@localhost:65432/fullstack_starter
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:65432/fullstack_starter_test
      DATABASE_URL_TEST_ADMIN: postgresql://postgres:postgres@localhost:65432/fullstack_starter_test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 65432 -U postgres && exit 0
            sleep 2
          done
          exit 1

      - name: Run database migrations
        run: pnpm --filter api db:migrate

      - name: Set application DATABASE_URL (restricted role from migration 0007)
        run: |
          echo "DATABASE_URL=postgresql://fullstack_starter_app:fullstack_starter_app@localhost:65432/fullstack_starter" >> "$GITHUB_ENV"

      - name: Verify generated docs and contracts
        run: pnpm run generate:check

  quality:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.2
        env:
          POSTGRES_DB: fullstack_starter
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 65432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fullstack_starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "65432"
      TURBO_FILTER: ...[origin/${{ github.base_ref || 'main' }}]
      POSTGRES_EXPOSED_PORT: "65432"
      POSTGRES_DB: fullstack_starter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_MIGRATE_URL: postgresql://postgres:postgres@localhost:65432/fullstack_starter
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:65432/fullstack_starter_test
      DATABASE_URL_TEST_ADMIN: postgresql://postgres:postgres@localhost:65432/fullstack_starter_test

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 65432 -U postgres && exit 0
            sleep 2
          done
          exit 1

      - name: Run database migrations
        run: pnpm --filter api db:migrate

      - name: Set application DATABASE_URL (restricted role from migration 0007)
        run: |
          echo "DATABASE_URL=postgresql://fullstack_starter_app:fullstack_starter_app@localhost:65432/fullstack_starter" >> "$GITHUB_ENV"

      - name: Lint
        run: pnpm run lint:policy && pnpm exec turbo run lint --filter=...[origin/${{ github.base_ref || 'main' }}]

      - name: Format check
        run: pnpm run format:check

      - name: Schema drift and migration integrity check
        run: pnpm run schema:check

      - name: Source policy
        run: bash scripts/check-source-policy.sh

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter=...[origin/${{ github.base_ref || 'main' }}]

      - name: Build
        run: pnpm exec turbo run build --filter=...[origin/${{ github.base_ref || 'main' }}]

      - name: Test
        # api mail-template packaging asserts against dist/; build must run first.
        run: pnpm exec turbo run test --filter=...[origin/${{ github.base_ref || 'main' }}]

      - name: Aggregate coverage baseline
        run: pnpm run test:coverage

  api-e2e:
    needs: changes
    if: needs.changes.outputs.api_e2e == 'true'
    name: API e2e
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.2
        env:
          POSTGRES_DB: fullstack_starter
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 65432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fullstack_starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "65432"
      POSTGRES_EXPOSED_PORT: "65432"
      POSTGRES_DB: fullstack_starter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_MIGRATE_URL: postgresql://postgres:postgres@localhost:65432/fullstack_starter
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:65432/fullstack_starter_test
      DATABASE_URL_TEST_ADMIN: postgresql://postgres:postgres@localhost:65432/fullstack_starter_test
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 65432 -U postgres && exit 0
            sleep 2
          done
          exit 1

      - name: Run database migrations
        run: pnpm --filter api db:migrate

      - name: Set application DATABASE_URL (restricted role from migration 0007)
        run: |
          echo "DATABASE_URL=postgresql://fullstack_starter_app:fullstack_starter_app@localhost:65432/fullstack_starter" >> "$GITHUB_ENV"

      - name: API e2e
        # Exclude health.e2e: Nest Terminus + node-redis readiness hangs in GHA even with
        # connectTimeout (tracked separately). The other 12 e2e suites cover tenant/auth/MFA/SSO.
        run: >
          pnpm --filter api exec vitest run
          --maxWorkers=1
          test/audit.e2e.spec.ts
          test/background-jobs-tenant.e2e.spec.ts
          test/files-catalog.e2e.spec.ts
          test/job-observability.e2e.spec.ts
          test/maintenance-mode.e2e.spec.ts
          test/mfa.e2e.spec.ts
          test/notifications.e2e.spec.ts
          test/organization-management.e2e.spec.ts
          test/permission-migration-and-roles.e2e.spec.ts
          test/preferences.e2e.spec.ts
          test/sso.e2e.spec.ts
          test/throttling.e2e.spec.ts
          test/tenant-isolation.e2e.spec.ts

  browser-e2e:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    name: Browser e2e
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.2
        env:
          POSTGRES_DB: fullstack_starter
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 65432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fullstack_starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "65432"
      POSTGRES_EXPOSED_PORT: "65432"
      POSTGRES_DB: fullstack_starter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_MIGRATE_URL: postgresql://postgres:postgres@localhost:65432/fullstack_starter
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:65432/fullstack_starter_test
      DATABASE_URL_TEST_ADMIN: postgresql://postgres:postgres@localhost:65432/fullstack_starter_test
      REDIS_URL: ""
      API_PORT: "3001"
      WEB_PORT: "3000"
      ADMIN_PORT: "3002"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 65432 -U postgres && exit 0
            sleep 2
          done
          exit 1

      - name: Run database migrations
        run: pnpm --filter api db:migrate

      - name: Build API for browser e2e
        run: pnpm --filter api build

      - name: Set application DATABASE_URL (restricted role from migration 0007)
        run: |
          echo "DATABASE_URL=postgresql://fullstack_starter_app:fullstack_starter_app@localhost:65432/fullstack_starter" >> "$GITHUB_ENV"

      - name: Seed browser e2e database
        run: pnpm --filter api db:seed

      - name: Browser e2e
        run: pnpm --filter web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    name: Mobile verification and release build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Mobile verification target
        run: pnpm run mobile:check

      - name: Release APK build
        run: pnpm run mobile:build

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
