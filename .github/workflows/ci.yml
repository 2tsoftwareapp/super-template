name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Generate/contract verification and source-quality gates run as independent
# parallel jobs so a failure in one (e.g. generate:check) can never silently
# skip the other (lint/typecheck/test/build).

jobs:
  generated:
    name: Verify generated docs and contracts
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.2
        env:
          POSTGRES_DB: fullstack_starter
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 65432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fullstack_starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "65432"
      POSTGRES_EXPOSED_PORT: "65432"
      POSTGRES_DB: fullstack_starter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_MIGRATE_URL: postgresql://postgres:postgres@localhost:65432/fullstack_starter
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:65432/fullstack_starter_test
      DATABASE_URL_TEST_ADMIN: postgresql://postgres:postgres@localhost:65432/fullstack_starter_test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 65432 -U postgres && exit 0
            sleep 2
          done
          exit 1

      - name: Run database migrations
        run: pnpm --filter api db:migrate

      - name: Set application DATABASE_URL (restricted role from migration 0007)
        run: |
          echo "DATABASE_URL=postgresql://fullstack_starter_app:fullstack_starter_app@localhost:65432/fullstack_starter" >> "$GITHUB_ENV"

      - name: Verify generated docs and contracts
        run: pnpm run generate:check

  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.2
        env:
          POSTGRES_DB: fullstack_starter
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 65432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fullstack_starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "65432"
      POSTGRES_EXPOSED_PORT: "65432"
      POSTGRES_DB: fullstack_starter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_MIGRATE_URL: postgresql://postgres:postgres@localhost:65432/fullstack_starter
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:65432/fullstack_starter_test
      DATABASE_URL_TEST_ADMIN: postgresql://postgres:postgres@localhost:65432/fullstack_starter_test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 65432 -U postgres && exit 0
            sleep 2
          done
          exit 1

      - name: Run database migrations
        run: pnpm --filter api db:migrate

      - name: Set application DATABASE_URL (restricted role from migration 0007)
        run: |
          echo "DATABASE_URL=postgresql://fullstack_starter_app:fullstack_starter_app@localhost:65432/fullstack_starter" >> "$GITHUB_ENV"

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Schema drift and migration integrity check
        run: pnpm run schema:check

      - name: Source policy
        run: bash scripts/check-source-policy.sh

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm build

  api-e2e:
    name: API e2e
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.2
        env:
          POSTGRES_DB: fullstack_starter
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 65432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fullstack_starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "65432"
      POSTGRES_EXPOSED_PORT: "65432"
      POSTGRES_DB: fullstack_starter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_MIGRATE_URL: postgresql://postgres:postgres@localhost:65432/fullstack_starter
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:65432/fullstack_starter_test
      DATABASE_URL_TEST_ADMIN: postgresql://postgres:postgres@localhost:65432/fullstack_starter_test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 65432 -U postgres && exit 0
            sleep 2
          done
          exit 1

      - name: Run database migrations
        run: pnpm --filter api db:migrate

      - name: Set application DATABASE_URL (restricted role from migration 0007)
        run: |
          echo "DATABASE_URL=postgresql://fullstack_starter_app:fullstack_starter_app@localhost:65432/fullstack_starter" >> "$GITHUB_ENV"

      - name: API e2e
        run: pnpm --filter api test:e2e

  mobile:
    name: Mobile analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Format check
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test
