name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.2
        env:
          POSTGRES_DB: fullstack_starter
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fullstack_starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: fullstack_starter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fullstack_starter
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/fullstack_starter_test
      API_PORT: 3001
      WEB_PORT: 3000
      WEB_ORIGIN: http://localhost:3000
      API_INTERNAL_URL: http://localhost:3001
      NEXT_PUBLIC_WEB_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_PATH: /api
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-ci
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-ci
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      MAIL_HOST: localhost
      MAIL_PORT: 1025
      MAIL_FROM: no-reply@example.local
      MAILPIT_HTTP_PORT: 8025
      POSTGRES_EXPOSED_PORT: 5432
      API_DOCS_ENABLED: "true"
      COOKIE_SECURE: "false"
      COOKIE_DOMAIN: ""
      COOKIE_SAMESITE: lax
      CSRF_SECRET: ci-csrf-secret-ci-csrf-secret-ci
      SEED_ADMIN_EMAIL: admin@example.local
      SEED_ADMIN_PASSWORD: ChangeMe123!
      SEED_USER_EMAIL: user@example.local
      SEED_USER_PASSWORD: ChangeMe123!

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        run: corepack prepare pnpm@11.7.0 --activate

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Flutter dependencies
        run: cd apps/mobile && flutter pub get

      - name: Wait for PostgreSQL
        run: ./scripts/wait-for-postgres.sh

      - name: Run migrations
        run: pnpm --filter api db:migrate

      - name: Seed development data
        run: pnpm --filter api db:seed

      - name: Create and migrate test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE fullstack_starter_test;"
          pnpm --filter api db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fullstack_starter_test

      - name: Generate contracts
        run: ./scripts/generate-contracts.sh

      - name: Check generated files
        run: git diff --exit-code -- apps/api/openapi.json packages/api-contract/src/generated apps/mobile/lib/generated/api

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: API tests
        run: pnpm --filter api test

      - name: Web tests
        run: pnpm --filter web test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Web E2E tests
        run: pnpm --filter web test:e2e

      - name: Flutter format check
        run: cd apps/mobile && dart format --set-exit-if-changed .

      - name: Flutter analyze
        run: cd apps/mobile && flutter analyze

      - name: Flutter test
        run: cd apps/mobile && flutter test
