name: Deploy Architecture Wiki

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: architecture-wiki
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: docs/architecture-wiki
          destination: ./_site/docs-wiki

      - name: Add root redirect
        run: |
          sudo mkdir -p ./_site
          printf '%s\n' \
            '<!doctype html>' \
            '<meta http-equiv="refresh" content="0; url=./docs-wiki/">' \
            '<link rel="canonical" href="./docs-wiki/">' \
            | sudo tee ./_site/index.html > /dev/null
          sudo chmod 644 ./_site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
