# Production-shaped stack: docker compose -f compose.prod.yaml --env-file .env.production up -d --build
# Put a TLS-terminating reverse proxy in front of web (3000), admin (3002) and api (3001).
name: lean-prod
x-app: &app
  restart: unless-stopped
  env_file: .env.production
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    build: { context: ., target: api }
    image: lean-api
    restart: "no"
    command: ["sh", "-c", "node db/migrate.js && node db/seed.js"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    build: { context: ., target: api }
    image: lean-api
    ports: ["3001:3001"]
    volumes:
      - api-storage:/app/storage
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    build: { context: ., target: worker }
    depends_on:
      migrate: { condition: service_completed_successfully }

  admin:
    <<: *app
    build: { context: ., target: admin }
    ports: ["3002:3002"]
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api: { condition: service_healthy }

  web:
    <<: *app
    build: { context: ., target: web }
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  api-storage:
